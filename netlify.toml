# Configurazione deploy Netlify — sito statico.
# Il comando di build timbra la versione (data + commit) nell'HTML,
# così dall'app si vede subito se si sta guardando l'ultimo deploy.
[build]
  publish = "."
  command = 'sed -i "s|__BUILD__|$(date -u +%d/%m/%Y) · ${COMMIT_REF:0:7}|g" gestionale-oculista.html'

# Serve il gestionale direttamente sulla root (rewrite, URL pulito)
[[redirects]]
  from = "/"
  to = "/gestionale-oculista.html"
  status = 200

# L'app è un singolo HTML: mai servirlo dalla cache del browser,
# così ogni ricarica prende sempre l'ultima versione pubblicata.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"
